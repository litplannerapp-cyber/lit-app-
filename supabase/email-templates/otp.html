<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Lit Planner code</title>
</head>
<body style="margin:0; padding:0; background-color:#F6F1EA; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F6F1EA; padding:48px 20px;">
  <tr>
    <td align="center">
      <table role="presentation" width="420" cellpadding="0" cellspacing="0" style="background-color:#FDFAF5; border-radius:26px; overflow:hidden; box-shadow:0 20px 50px rgba(46,42,38,.08);">

        <!-- header: halo mark + wordmark -->
        <tr>
          <td align="center" style="padding:40px 32px 8px;">
            <img src="https://litplanner.app/images/email-halo.png" width="44" height="44" alt="Lit" style="display:block;">
            <div style="font-family:Georgia,'Times New Roman',serif; font-style:italic; font-weight:700; font-size:22px; color:#2E2A26; margin-top:10px;">
              Lit Planner
            </div>
          </td>
        </tr>

        <!-- body -->
        <tr>
          <td align="center" style="padding:8px 40px 0;">
            <p style="font-size:15px; color:#6b6459; line-height:1.6; margin:0;">
              Here's your code to sign in. It's valid for 10 minutes.
            </p>
          </td>
        </tr>

        <!-- the code itself -->
        <tr>
          <td align="center" style="padding:28px 32px;">
            <div style="display:inline-block; background:#F6F1EA; border-radius:16px; padding:18px 32px;">
              <span style="font-family:'SF Mono',Consolas,monospace; font-size:32px; font-weight:700; letter-spacing:0.35em; color:#2E2A26;">
                {{ .Token }}
              </span>
            </div>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding:0 40px 8px;">
            <p style="font-size:13px; color:#A79E92; line-height:1.6; margin:0;">
              Didn't request this? You can safely ignore this email.
            </p>
          </td>
        </tr>

        <!-- footer -->
        <tr>
          <td style="padding:32px 40px 36px; border-top:1px solid rgba(46,42,38,.08); margin-top:24px;">
            <p style="font-size:12px; color:#A79E92; text-align:center; margin:24px 0 0;">
              Lit Planner · Calm, on purpose.<br>
              <a href="https://litplanner.app/privacy" style="color:#A79E92; text-decoration:underline;">Privacy</a>
              &nbsp;·&nbsp;
              <a href="https://litplanner.app/terms" style="color:#A79E92; text-decoration:underline;">Terms</a>
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
